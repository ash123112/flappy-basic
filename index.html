<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Flappy Basic</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;
    font-family:system-ui,-apple-system,sans-serif;color:#eee;
    -webkit-user-select:none;user-select:none;touch-action:manipulation}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  canvas{display:block;background:#4ec0ca;touch-action:none}
  #hint{position:fixed;left:0;right:0;bottom:6px;text-align:center;font-size:13px;opacity:.65}
  #err{position:fixed;inset:0;z-index:9;display:none;overflow:auto;padding:16px;
    background:#301010;color:#ffd9d9;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hint">Tap / space to flap — tap again to restart</div>
<div id="err"></div>
<script>
(function(){
"use strict";

var CONFIG = {
  W: 360, H: 640,
  groundY: 590,
  gravity: 1500,
  flap: -430,
  speed: 150,
  pipeW: 60,
  pipeGap: 160,
  spacing: 210,
  margin: 80,
  birdR: 12,
  birdX: 110,
  maxDt: 0.033
};
var KEY = 'flappy.v1.best';

var errBox = document.getElementById('err');
function fail(msg){ errBox.style.display='block'; errBox.textContent += msg + '\n'; }
window.onerror = function(m,s,l,c,e){ fail('Error: ' + m + ' @' + l + ':' + c + (e && e.stack ? '\n' + e.stack : '')); };

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var scale = 1;

function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  scale = Math.min(window.innerWidth / CONFIG.W, window.innerHeight / CONFIG.H);
  canvas.style.width  = (CONFIG.W * scale) + 'px';
  canvas.style.height = (CONFIG.H * scale) + 'px';
  canvas.width  = Math.round(CONFIG.W * scale * dpr);
  canvas.height = Math.round(CONFIG.H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);

var state, bird, pipes, score, best, last;

function loadBest(){
  try { return parseInt(localStorage.getItem(KEY) || '0', 10) || 0; } catch(e){ return 0; }
}
function saveBest(v){
  try { localStorage.setItem(KEY, String(v)); } catch(e){}
}

function makePipe(x){
  var min = CONFIG.margin;
  var max = CONFIG.groundY - CONFIG.margin - CONFIG.pipeGap;
  return { x: x, gapY: min + Math.random() * (max - min), passed: false };
}

function reset(){
  state = 'ready';
  bird = { y: CONFIG.H * 0.4, vy: 0 };
  pipes = [ makePipe(CONFIG.W + 60), makePipe(CONFIG.W + 60 + CONFIG.spacing) ];
  score = 0;
  best = loadBest();
  last = 0;
}

function flap(){
  if (state === 'ready'){ state = 'play'; bird.vy = CONFIG.flap; }
  else if (state === 'play'){ bird.vy = CONFIG.flap; }
  else if (state === 'over'){ reset(); }
}

function hit(p){
  var r = CONFIG.birdR, bx = CONFIG.birdX;
  if (bx + r < p.x || bx - r > p.x + CONFIG.pipeW) return false;
  return (bird.y - r < p.gapY) || (bird.y + r > p.gapY + CONFIG.pipeGap);
}

function update(dt){
  if (state !== 'play') return;
  bird.vy += CONFIG.gravity * dt;
  bird.y  += bird.vy * dt;

  var i, p, lastX = 0;
  for (i = 0; i < pipes.length; i++){
    p = pipes[i];
    p.x -= CONFIG.speed * dt;
    if (!p.passed && p.x + CONFIG.pipeW < CONFIG.birdX - CONFIG.birdR){
      p.passed = true;
      score++;
    }
    if (p.x > lastX) lastX = p.x;
    if (hit(p)) gameOver();
  }
  pipes = pipes.filter(function(q){ return q.x + CONFIG.pipeW > -10; });
  if (lastX < CONFIG.W - CONFIG.spacing) pipes.push(makePipe(CONFIG.W + 10));

  if (bird.y + CONFIG.birdR >= CONFIG.groundY){ bird.y = CONFIG.groundY - CONFIG.birdR; gameOver(); }
  if (bird.y - CONFIG.birdR < 0){ bird.y = CONFIG.birdR; bird.vy = 0; }
}

function gameOver(){
  if (state !== 'play') return;
  state = 'over';
  if (score > best){ best = score; saveBest(best); }
}

function draw(){
  var W = CONFIG.W, H = CONFIG.H, gy = CONFIG.groundY;

  ctx.fillStyle = '#4ec0ca'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ded895'; ctx.fillRect(0, gy, W, H - gy);
  ctx.fillStyle = '#5ec33f'; ctx.fillRect(0, gy, W, 10);

  ctx.fillStyle = '#3fae2b';
  ctx.strokeStyle = '#1f6b16';
  ctx.lineWidth = 2;
  for (var i = 0; i < pipes.length; i++){
    var p = pipes[i];
    ctx.fillRect(p.x, 0, CONFIG.pipeW, p.gapY);
    ctx.strokeRect(p.x, 0, CONFIG.pipeW, p.gapY);
    var by = p.gapY + CONFIG.pipeGap;
    ctx.fillRect(p.x, by, CONFIG.pipeW, gy - by);
    ctx.strokeRect(p.x, by, CONFIG.pipeW, gy - by);
  }

  var rot = Math.max(-0.5, Math.min(1.2, bird.vy / 600));
  ctx.save();
  ctx.translate(CONFIG.birdX, bird.y);
  ctx.rotate(state === 'ready' ? 0 : rot);
  ctx.fillStyle = '#ffd400';
  ctx.beginPath(); ctx.arc(0, 0, CONFIG.birdR, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#a06800'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#ff8c1a';
  ctx.beginPath(); ctx.moveTo(CONFIG.birdR - 2, 1); ctx.lineTo(CONFIG.birdR + 8, 4); ctx.lineTo(CONFIG.birdR - 2, 6); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(4, -4, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(5, -4, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(0,0,0,.45)';
  ctx.lineWidth = 3;
  ctx.font = 'bold 44px system-ui,sans-serif';
  ctx.strokeText(score, W / 2, 80);
  ctx.fillText(score, W / 2, 80);
  ctx.font = '14px system-ui,sans-serif';
  ctx.strokeText('best ' + best, W / 2, 105);
  ctx.fillText('best ' + best, W / 2, 105);

  if (state !== 'play'){
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(30, H / 2 - 70, W - 60, 120);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px system-ui,sans-serif';
    ctx.fillText(state === 'ready' ? 'Flappy Basic' : 'Game Over', W / 2, H / 2 - 30);
    ctx.font = '16px system-ui,sans-serif';
    ctx.fillText(state === 'ready' ? 'tap to start' : 'score ' + score + ' — tap to retry', W / 2, H / 2 + 5);
    ctx.fillText('tap anywhere', W / 2, H / 2 + 30);
  }
}

function frame(t){
  if (!last) last = t;
  var dt = Math.min((t - last) / 1000, CONFIG.maxDt);
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

window.addEventListener('pointerdown', function(e){ e.preventDefault(); flap(); }, { passive: false });
window.addEventListener('keydown', function(e){
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === ' '){ e.preventDefault(); flap(); }
});
document.addEventListener('visibilitychange', function(){ last = 0; });

resize();
reset();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
